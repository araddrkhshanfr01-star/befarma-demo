  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بفرما | قالب احراز هویت و پنل مدیریت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  
<script>
tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            vazir: ['Vazirmatn', 'sans-serif'],
          },
          colors: {
            brand: {
              purple: '#7928CA',
              indigo: '#4338CA',
              cyan: '#06B6D4',
              pink: '#EC4899',
            }
          },
          animation: {
            'blob-slow': 'blobFloat 16s infinite ease-in-out alternate',
            'blob-reverse': 'blobFloatReverse 20s infinite ease-in-out alternate',
            'pulse-subtle': 'pulseSubtle 4s infinite ease-in-out',
          },
          keyframes: {
            blobFloat: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(40px, -60px) scale(1.15)' },
              '66%': { transform: 'translate(-30px, 30px) scale(0.92)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            blobFloatReverse: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(-50px, 40px) scale(1.2)' },
              '66%': { transform: 'translate(40px, -40px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '0.6' },
              '50%': { opacity: '0.9' },
            }
          }
        }
      }
    }
</script>
<link rel="stylesheet" href="assets/style.css">
</head>

  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" id="galaxy-bg">
    <!-- هاله بنفش تپنده بالا راست -->
    <div class="absolute -top-24 -right-24 w-[520px] h-[520px] bg-purple-600/35 rounded-full blur-[115px] animate-blob-slow"></div>
    <!-- هاله نیلی و آبی مرکز متمایل به چپ -->
    <div class="absolute top-1/3 -left-32 w-[600px] h-[600px] bg-indigo-600/30 rounded-full blur-[130px] animate-blob-reverse"></div>
    <!-- هاله سایان و بنفش پایین -->
    <div class="absolute -bottom-32 right-1/4 w-[550px] h-[550px] bg-cyan-500/20 rounded-full blur-[120px] animate-pulse-subtle"></div>
