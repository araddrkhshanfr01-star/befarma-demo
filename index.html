<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="دموی HTML قالب بفرما با رابط کاربری مدرن و RTL فارسی">

<style>
body{min-height:100vh;display:grid;place-items:center;padding:32px}
.product{width:min(760px,100%);padding:34px;text-align:center}
.product h1{font-size:32px;margin:0 0 10px}
.product p{opacity:.7;line-height:1.9}
.product a{display:inline-flex;margin:8px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,#7928ca,#4f46e5,#06b6d4);color:#fff;text-decoration:none}
</style>
</head>
<body class="dark">
<main class="glass-card product">
<h1>بفرما — قالب HTML</h1>
<p>دموی قالب HTML فارسی و RTL با طراحی مدرن، صفحات ورود و ثبت‌نام و پنل مدیریت تعاملی.</p>
<a href="page-1.html">مشاهده صفحه ورود و ثبت‌نام</a>
<a href="page-2.html">مشاهده پنل مدیریت</a>

<script>(function(){document.addEventListener('contextmenu',function(e){e.preventDefault();});document.addEventListener('dragstart',function(e){e.preventDefault();});document.addEventListener('keydown',function(e){if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(e.key.toUpperCase()))||(e.ctrlKey&&e.key.toUpperCase()==='U'))e.preventDefault();});})();</script>
